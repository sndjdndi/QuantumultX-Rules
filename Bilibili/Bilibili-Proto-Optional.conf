# Bilibili optional Protobuf enhancement - Quantumult X - 2026-11-11
# NOT enabled by default. This file is optional and separate from Bilibili.conf.
# Source implementation: ZenmoFeiShi/Qx/bili_view_ad.js (QX-specific, 2026-06-07).
# Upstream script locked to repository commit for reproducible behavior.
# Can enhance popular/dynamic/related cards and player details, BUT binary gRPC
# rewriting can cause issues in video details or related comment UI depending on version.
# No modification of Reply/MainList or other comment endpoints is included.
#
# Only enable AFTER Bilibili.conf is working, and disable this optional subscription
# immediately if video details, playback, comments or dynamic feed fail to load.

hostname = app.bilibili.com

# Popular, dynamic and default search words
^https:\/\/app\.bilibili\.com\/bilibili\.app\.show\.v1\.Popular\/Index$ url script-response-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/5df3cafc468419e7b58b0f4a1b75df0786ab1c67/bili_view_ad.js
^https:\/\/app\.bilibili\.com\/bilibili\.app\.dynamic\.v2\.Dynamic\/DynAll$ url script-response-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/5df3cafc468419e7b58b0f4a1b75df0786ab1c67/bili_view_ad.js
^https:\/\/app\.bilibili\.com\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$ url script-response-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/5df3cafc468419e7b58b0f4a1b75df0786ab1c67/bili_view_ad.js

# Video detail and playback are intentionally OFF by default; remove leading # below
# ONLY after the above three rules work and app network activity can be checked.
#^https:\/\/app\.bilibili\.com\/bilibili\.app\.viewunite\.v1\.View\/View$ url script-response-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/5df3cafc468419e7b58b0f4a1b75df0786ab1c67/bili_view_ad.js
#^https:\/\/app\.bilibili\.com\/bilibili\.app\.playerunite\.v1\.Player\/PlayViewUnite$ url script-response-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/5df3cafc468419e7b58b0f4a1b75df0786ab1c67/bili_view_ad.js
