# Bilibili Quantumult X v2.0 KeLee logic adaptation - 2026-11-12
# One subscription ONLY. Adapted from public Loon kokoryh/KeLee field-level behavior.
# QX is not Loon. Script uses independent protobuf wire parser; Loon scripts are not QX compatible.
# Fix from v1.1: include all known View / RelatesFeed / AIRelateAsync below-player ad sources.
# No broad protobuf rewrites for replies/comments. No grpc domain REJECT.
# NOTE: QX may not MITM all HTTP/2 gRPC sessions. Observe network activity to confirm.
# Refresh this remote rewrite; disable old Bilibili / Moyu resources before testing.
# HTTPS certificate trusted + MITM enabled. No QX HTTP capture required.

hostname = app.bilibili.com, grpc.biliapi.net, api.bilibili.com, api.live.bilibili.com, line3-h5-mobile-api.biligame.com

# [1] Splash: remove ad data while retaining a valid API shape.
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/(?:show|list|event\/list2)(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js

# [2] Recommended home feed and vertical-story feed.
^https:\/\/app\.bilibili\.com\/x\/v2\/feed\/index(?:\/story)?(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js

# [3] App tabs (only remove promotional Game Center), search ad cards.
^https:\/\/app\.bilibili\.com\/x\/resource\/show\/tab\/v2(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js
^https:\/\/app\.bilibili\.com\/x\/v2\/search\/square(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js

# [4] PGC overlay and in-channel promotional banner.
^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js
^https:\/\/api\.bilibili\.com\/pgc\/page\/channel(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js

# [5] Live home and room: target only explicit ad fields, keep room data and live stream.
^https:\/\/api\.live\.bilibili\.com\/xlive\/app-interface\/v2\/index\/feed(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js
^https:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoBy(?:Room|User)(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-json.js

# [6] Narrowly scoped standalone ad/commerce interfaces; avoid core comments and detail APIs.
^https:\/\/app\.bilibili\.com\/x\/resource\/top\/activity(?:\?|$) url reject-dict
^https:\/\/api\.bilibili\.com\/x\/vip\/ads\/materials(?:\?|$) url reject-dict
^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info(?:\?|$) url reject-dict
^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material(?:\?|$) url reject-dict

# [7] Video page protobuf commercial filtering (KeLee field approach)
# Source is our original script: preserves unknown protobuf fields, parser errors fail open.
# app.bilibili.com and grpc.biliapi.net are both covered.
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.view\.v1\.View\/View$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.view\.v1\.View\/RelatesFeed$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.view\.v1\.View\/ViewProgress$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.viewunite\.v1\.View\/View$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.viewunite\.v1\.View\/RelatesFeed$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.viewunite\.v1\.View\/AIRelateAsync$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.app\.playerunite\.v1\.Player\/PlayViewUnite$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js
^https:\/\/(?:app\.bilibili\.com|grpc\.biliapi\.net)\/bilibili\.pgc\.gateway\.player\.v2\.PlayURL\/PlayView$ url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/Bilibili/bilibili-proto.js

# Deliberately untouched:
# bilibili.main.community.reply.* (all comment APIs)
# bilibili.community.service.dm.* (barrage)
# Video playback stream URLs, authentication, and media CDNs
