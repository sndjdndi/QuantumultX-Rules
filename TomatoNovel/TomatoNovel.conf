// TomatoNovel QX rewrite v1.0 - 2026-10-27
// Adapted from sve1r/Rules-For-Quantumult-X (original 2025-08-15)
// Conservative mode: avoid general video, livestream, and first-party content blocking.
// Import under [rewrite_remote]; enable QX MITM separately.

hostname = *.pangolin-sdk-toutiao.com, *.pglstatp-toutiao.com, *.pstatp.com, *.byteimg.com

# Pangolin ad endpoints
^https?:\/\/.+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/ url reject
# Ad media and app packages
^https?:\/\/.+\.pglstatp-toutiao\.com\/.+\/toutiao\.mp4 url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/web\.business\.image\/.+ url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/obj\/ad-pattern\/renderer url reject
^https?:\/\/.+\.pstatp\.com\/obj\/mosaic-legacy\/.+\?from=ad url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/.+\.byteimg\.com\/ad-app-package url reject
^https?:\/\/.+\.byteimg\.com\/web\.business\.image url reject

# Excluded deliberately: snssdk.com/video/play, fqnovelvod.com video,
# default.ixigua.com, generic ByteDance resources and unrelated app domains.
