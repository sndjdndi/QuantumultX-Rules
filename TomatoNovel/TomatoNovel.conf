# TomatoNovel Quantumult X rewrite V2.0 - 2026-10-28
# KeLee/Stash/app2smile plus captured 00:41 novel-player UA evidence.
# Adds three measures: ad SDK response normalization; known ad asset URLs;
# Fanqie JSON ad-slot/promotion cleanup (experimental); novel-only live FLV block.
# Requires enabled & trusted QX MITM for HTTPS rules. User need not enable HTTP capture.

hostname = api-access.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao.com, is.snssdk.com, fqnovel.com, *.fqnovel.com, *.pglstatp-toutiao.com, *.pstatp.com, *.byteimg.com, lf*-cdn-tos.bytescm.com

# [A] Novel-player live FLV from real QX HAR (00:41). URL AND User-Agent must match.
# This blocks ONLY ttplayer(...-novel), not generic Douyin playback.
# Depending on the app, video may stop while the full-screen ad container remains.
^http:\/\/pull-flv-[^\/]+\.douyincdn\.com\/stage\/[^?]+\.flv(?:\?|$) \r\nUser-Agent:.*ttplayer[^\r\n]*-novel url-and-header reject

# [B] Pangle SDK: return a well-formed no-fill response rather than arbitrary {}.
^https?:\/\/(?:[a-z0-9-]+\.)*pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/get_ads(?:\/|\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/TomatoNovel/ads-clean.js
^https?:\/\/is\.snssdk\.com\/api\/ad\/union\/sdk\/get_ads(?:\/|\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/TomatoNovel/ads-clean.js
^https?:\/\/(?:[a-z0-9-]+\.)*pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(?:stats|settings)(?:\/|\?|$) url reject-dict

# [C] Confirmed-style ad assets from multiple QX / KeLee community rules.
^https?:\/\/(?:[a-z0-9-]+\.)*pglstatp-toutiao\.com\/.+\/toutiao\.mp4(?:\?|$) url reject
^https?:\/\/(?:[a-z0-9-]+\.)*(?:pglstatp-toutiao|pstatp)\.com\/(?:obj|img)\/(?:ad-app-package|ad)\/ url reject
^https?:\/\/(?:[a-z0-9-]+\.)*(?:pglstatp-toutiao|pstatp)\.com\/(?:obj|img)\/web\.business\.image\/ url reject
^https?:\/\/(?:[a-z0-9-]+\.)*(?:pglstatp-toutiao|pstatp)\.com\/obj\/ad-pattern\/renderer(?:\/|\?|$) url reject
^https?:\/\/(?:[a-z0-9-]+\.)*pstatp\.com\/obj\/mosaic-legacy\/[^?]+\?[^#]*from=ad(?:&|$) url reject
^https?:\/\/(?:[a-z0-9-]+\.)*byteimg\.com\/(?:ad-app-package|web\.business\.image)(?:\/|\?|$) url reject
^https?:\/\/lf[0-9]*-cdn-tos\.bytescm\.com\/obj\/static\/ad\/ url reject

# [D] Experimental first-party JSON filtering for banner/full-screen promotion/ad slots.
# Performs no modification unless recognizable ad fields or identified promo appear.
# Non-JSON response and normal novel text are passed unchanged.
^https?:\/\/(?:[a-z0-9-]+\.)*fqnovel\.com\/[^?#]*(?:ad(?:s|vert|vertise)?|banner|popup|promotion|marketing|activity|reader|recommend|config|feed)[^?#]*(?:\?|$) url script-response-body https://raw.githubusercontent.com/sndjdndi/QuantumultX-Rules/main/TomatoNovel/ads-clean.js

# Excluded: /get_domains/v4/ (domain discovery, not ad delivery), generic livestream
# cdn domains, novel app media/video endpoints, unrelated App & CDN resources.
